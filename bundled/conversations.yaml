openapi: 3.0.3
info:
  title: NeetoChat Conversations APIs
  version: 1.0.0
servers:
  - description: NeetoChat APIs
    url: https://{your-subdomain}.neetochat.com/api/external/v2
    variables:
      your-subdomain:
        default: spinkart
        description: Replace **spinkart** with your [workspace's subdomain](/getting-started/workspace-subdomain).
tags:
  - name: Conversations
    description: APIs to list, create and update conversations in the workspace.
  - name: Messages
    description: APIs to read and send messages in a conversation.
paths:
  /conversations:
    get:
      summary: List conversations
      tags:
        - Conversations
      description: |
        List conversations in the workspace.

        To find conversations with new activity, pass the `updated_at` of the most recent conversation you have already processed as `updated_after` and sort by `updated_at` in ascending order. A new message or note in a conversation also updates its `updated_at`.
      parameters:
        - $ref: '#/components/parameters/api_key_header'
        - $ref: '#/components/parameters/accept_header'
        - in: query
          name: status
          description: Filter conversations by status. Pass several statuses as a comma-separated list, such as `open,waiting_on_customer`.
          required: false
          schema:
            type: string
            example: open
        - in: query
          name: updated_after
          description: Return only conversations updated after this time, as an ISO 8601 timestamp. A timestamp with a `+` offset must be URL-encoded (`%2B05:30`).
          required: false
          schema:
            type: string
            format: date-time
            example: '2026-10-05T10:00:00Z'
        - in: query
          name: sort
          description: Field to sort conversations by. Defaults to `created_at`. Conversations with the same value are ordered by `id`.
          required: false
          schema:
            type: string
            enum:
              - created_at
              - updated_at
            default: created_at
        - in: query
          name: order
          description: Sort direction. Defaults to `asc`.
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - $ref: '#/components/parameters/page_param'
        - $ref: '#/components/parameters/per_page_param'
      responses:
        '200':
          description: OK - Request succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conversation_list_response'
        '422':
          description: Unprocessable Entity - A query parameter has an invalid value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error: Invalid updated_after value. It must be an ISO 8601 timestamp.
    post:
      summary: Create conversation
      tags:
        - Conversations
      description: |
        Start a conversation on behalf of a contact.

        The contact is matched by `user_identifier`, then by `email`, and a new contact is created when neither matches.
      parameters:
        - $ref: '#/components/parameters/api_key_header'
        - $ref: '#/components/parameters/accept_header'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visitor_attributes:
                  type: object
                  description: Details of the contact starting the conversation.
                  properties:
                    email:
                      type: string
                      format: email
                      example: sam@example.com
                    name:
                      type: string
                      example: Sam Brown
                    phone_number:
                      type: string
                      example: '+14155550123'
                    user_identifier:
                      type: string
                      description: Your own identifier for the contact.
                      example: customer-1042
                    traits:
                      type: object
                      description: Custom attributes to store on the contact.
                      additionalProperties: true
                      example:
                        plan: Pro
                  required:
                    - email
                messages_attributes:
                  type: array
                  description: Messages from the contact that start the conversation. At least one message with a `body` is required.
                  items:
                    type: object
                    properties:
                      body:
                        type: string
                        example: Hi, I need help with a refund.
                      created_at:
                        type: string
                        format: date-time
                        description: ISO 8601 time the message was originally sent. Required on every message when the conversation has a `created_at`, and allowed only then. It can't be in the future or earlier than the conversation's `created_at`. Messages are stored in time order, whatever order you send them in.
                        example: '2025-03-01T10:00:00Z'
                      external_id:
                        type: string
                        description: Your own id for the message, unique in your workspace. It must not repeat within the request or match a message that already exists.
                        example: intercom-part-88231
                    required:
                      - body
                created_at:
                  type: string
                  format: date-time
                  description: ISO 8601 time the conversation originally started. Passing it imports the conversation. It can't be in the future.
                  example: '2025-03-01T10:00:00Z'
                closed_at:
                  type: string
                  format: date-time
                  description: ISO 8601 time the conversation was originally closed. Allowed only with `created_at` and a `status` of `closed`, and it can't be earlier than `created_at`. A closed conversation imported without it is closed at the time of its last message.
                  example: '2025-03-01T11:30:00Z'
                external_id:
                  type: string
                  description: Your own id for the conversation, unique in your workspace. When a conversation with this `external_id` already exists, it is returned with status `200` and nothing is created. Conversation and message ids are checked separately, so a message may reuse a conversation's id.
                  example: intercom-215472
                title:
                  type: string
                  example: 'Refund for order #1042'
                status:
                  type: string
                  description: Status of the conversation. It must be one of the statuses of your workspace.
                  example: open
                priority:
                  type: string
                  enum:
                    - low
                    - medium
                    - high
                    - urgent
                  example: high
                assignee_email:
                  type: string
                  format: email
                  description: Email of the team member to assign the conversation to. It is ignored when no team member has this email.
                  example: oliver@example.com
                group_name:
                  type: string
                  description: Name of the group to assign the conversation to. It is ignored when no group has this name.
                  example: Billing
                tags:
                  type: array
                  description: Names of the tags to add to the conversation. Tags that don't exist yet are created.
                  items:
                    type: string
                  example:
                    - refund
                    - priority-customer
                ticket_fields:
                  type: object
                  description: Ticket field values keyed by the field's name. Use the option label for dropdown fields, an array of labels for multi-select fields and `true` or `false` for checkbox fields.
                  additionalProperties: true
                  example:
                    Order number: '1042'
                origin_page_url:
                  type: string
                  description: URL of the page the conversation was started from.
                  example: https://example.com/pricing
                origin_page_title:
                  type: string
                  description: Title of the page the conversation was started from.
                  example: Pricing
              required:
                - visitor_attributes
                - messages_attributes
      responses:
        '200':
          description: OK - A conversation with this `external_id` already exists, and it is returned unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conversation_response'
        '201':
          description: Created - Conversation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conversation_response'
        '422':
          description: Unprocessable Entity - The request body is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                missing_message:
                  summary: No message
                  value:
                    error: A conversation must include at least one message.
                invalid_timestamp:
                  summary: Unparseable timestamp
                  value:
                    error: Invalid created_at. It must be an ISO 8601 timestamp.
                message_before_conversation:
                  summary: Message dated before the conversation
                  value:
                    error: A message's created_at can't be earlier than its conversation's created_at.
                duplicate_message_external_id:
                  summary: Message external_id already used
                  value:
                    error: 'Message external_id must be unique: intercom-part-88231.'
  /conversations/{conversation_id}:
    get:
      summary: Get conversation details
      tags:
        - Conversations
      description: Retrieves details of a specific conversation.
      parameters:
        - $ref: '#/components/parameters/api_key_header'
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/conversation_id_param'
      responses:
        '200':
          description: OK - Request succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conversation_response'
        '404':
          description: Not Found - No conversation with this id exists in the workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    patch:
      summary: Update conversation
      tags:
        - Conversations
      description: Update a conversation. Only the fields you pass are changed.
      parameters:
        - $ref: '#/components/parameters/api_key_header'
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/conversation_id_param'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: 'Refund for order #1042'
                status:
                  type: string
                  description: Status of the conversation. It must be one of the statuses of your workspace.
                  example: closed
                priority:
                  type: string
                  enum:
                    - low
                    - medium
                    - high
                    - urgent
                  example: medium
                assignee_email:
                  type: string
                  format: email
                  description: Email of the team member to assign the conversation to. It is ignored when no team member has this email.
                  example: oliver@example.com
                group_name:
                  type: string
                  description: Name of the group to assign the conversation to. It is ignored when no group has this name.
                  example: Billing
                tags:
                  type: array
                  description: Names of the tags the conversation should have. This replaces the conversation's current tags, and tags that don't exist yet are created.
                  items:
                    type: string
                  example:
                    - refund
                ticket_fields:
                  type: object
                  description: Ticket field values keyed by the field's name. Use the option label for dropdown fields, an array of labels for multi-select fields and `true` or `false` for checkbox fields.
                  additionalProperties: true
                  example:
                    Order number: '1042'
      responses:
        '200':
          description: OK - Request succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conversation_response'
        '404':
          description: Not Found - No conversation with this id exists in the workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '422':
          description: Unprocessable Entity - The request body is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error: 'Invalid ticket field: Order number.'
  /conversations/{conversation_id}/messages:
    get:
      summary: List messages
      tags:
        - Messages
      description: List the messages in a conversation, oldest first. Internal notes and messages created by NeetoChat are included.
      parameters:
        - $ref: '#/components/parameters/api_key_header'
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/conversation_id_param'
        - $ref: '#/components/parameters/page_param'
        - $ref: '#/components/parameters/per_page_param'
      responses:
        '200':
          description: OK - Request succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/message_list_response'
        '404':
          description: Not Found - No conversation with this id exists in the workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    post:
      summary: Send message
      tags:
        - Messages
      description: |
        Add a message or an internal note to a conversation.

        The sender is resolved from `sender_email`. If it belongs to an active team member, the message is sent as a reply from that team member. Otherwise it is sent as a message from the contact with that email, and a new contact is created when none exists.

        Pass `created_at` to import a message from another tool. It keeps that date, is stored as already read, and sends no notification, runs no automation rule or webhook and records no reporting data. It also doesn't assign the conversation to the team member who sent it. See [Importing past conversations](/api-reference/conversations/add#importing-past-conversations).

        Pass `external_id` to make the request safe to retry. When a message with the same `external_id` already exists in the workspace, it is returned with status `200` and nothing new is created.
      parameters:
        - $ref: '#/components/parameters/api_key_header'
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/conversation_id_param'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: Content of the message.
                  example: Thanks, we have processed your refund.
                sender_email:
                  type: string
                  format: email
                  description: Email of the team member or contact sending the message. A note must be sent by an active team member.
                  example: oliver@example.com
                kind:
                  type: string
                  enum:
                    - user_message
                    - note
                  default: user_message
                  description: Pass `note` to add an internal note that only team members can see.
                created_at:
                  type: string
                  format: date-time
                  description: ISO 8601 time the message was originally sent. Passing it imports the message. It can't be in the future or earlier than the conversation's `created_at`.
                  example: '2025-03-01T10:30:00Z'
                external_id:
                  type: string
                  description: Your own id for the message, unique in your workspace among messages. When a message with this `external_id` already exists in this conversation, it is returned with status `200` and nothing is created. If it belongs to another conversation, the request is rejected with status `422`.
                  example: intercom-part-88232
                mentions:
                  type: array
                  description: Team members to mention in a note. Mentions are only supported when `kind` is `note`. Each `@Name` in the body that matches a mentioned team member becomes a mention, and team members not named in the body are mentioned at the end of the note.
                  items:
                    type: object
                    properties:
                      email:
                        type: string
                        format: email
                        example: jane@example.com
              required:
                - body
                - sender_email
      responses:
        '200':
          description: OK - A message with this `external_id` already exists, and it is returned unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/message_response'
        '201':
          description: Created - Message added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/message_response'
        '404':
          description: Not Found - No conversation with this id exists in the workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '422':
          description: Unprocessable Entity - The request body is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error: Only agents can add notes. sender_email must belong to an agent.
  /conversations/{conversation_id}/messages/{message_id}:
    get:
      summary: Get message details
      tags:
        - Messages
      description: Retrieves a specific message in a conversation.
      parameters:
        - $ref: '#/components/parameters/api_key_header'
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/conversation_id_param'
        - in: path
          name: message_id
          description: Id of the message. You can get `message_id` by listing the conversation's messages using our [List messages](/api-reference/messages/list) API.
          required: true
          schema:
            type: string
            format: uuid
            example: 1bf689fc-9f92-4e39-9f71-4a97078d2b8f
      responses:
        '200':
          description: OK - Request succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/message_response'
        '404':
          description: Not Found - No message with this id exists in the conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
components:
  parameters:
    api_key_header:
      in: header
      name: X-Api-Key
      description: Use the X-Api-Key header to provide your workspace API key. Refer to [Authentication](/getting-started/authentication) for more information.
      required: true
      schema:
        type: string
        default: your-api-key
    accept_header:
      in: header
      name: Accept
      description: Specifies the expected response format. Must be set to `application/json` for proper API communication.
      required: true
      schema:
        type: string
        enum:
          - application/json
        default: application/json
    page_param:
      in: query
      name: page
      description: Page number to retrieve, starting from 1. Defaults to 1 when omitted.
      required: false
      schema:
        type: integer
        example: 1
    per_page_param:
      in: query
      name: per_page
      description: Number of records per page. Defaults to 15 when omitted, and values above 100 are capped at 100. `page_size` is accepted as an alias.
      required: false
      schema:
        type: integer
        example: 15
    conversation_id_param:
      in: path
      name: conversation_id
      description: Id of the conversation. You can get `conversation_id` by listing conversations using our [List conversations](/api-reference/conversations/list) API.
      required: true
      schema:
        type: string
        format: uuid
        example: de414e85-a1b5-4240-a465-7b32606980ce
  schemas:
    conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: de414e85-a1b5-4240-a465-7b32606980ce
        status:
          type: string
          description: Name of the conversation's status. The default statuses are `new`, `open`, `waiting_on_customer`, `on_hold`, `closed`, `spam` and `trash`, and your workspace may also have custom statuses.
          example: open
        title:
          type: string
          nullable: true
          example: 'Refund for order #1042'
        priority:
          type: string
          enum:
            - low
            - medium
            - high
            - urgent
          example: low
        channel_name:
          type: string
          description: Unique identifier of the conversation's chat channel.
          example: b945fd3cd2573017052901d6dbd0832f
        origin_page_url:
          type: string
          nullable: true
          description: URL of the page the conversation was started from.
          example: https://example.com/pricing
        origin_page_title:
          type: string
          nullable: true
          description: Title of the page the conversation was started from.
          example: Pricing
        external_id:
          type: string
          nullable: true
          description: Your own id for the conversation, as sent when it was created.
          example: null
        created_at:
          type: string
          format: date-time
          example: '2026-09-23T18:07:53.661Z'
        updated_at:
          type: string
          format: date-time
          description: Time the conversation was last changed. A new message or note in the conversation also updates it.
          example: '2026-10-05T16:26:58.143Z'
        agent:
          type: object
          description: Team member assigned to the conversation. All fields are `null` when the conversation is unassigned.
          properties:
            id:
              type: string
              format: uuid
              nullable: true
              example: 05665eee-4602-4317-8f7f-767b04274e5f
            name:
              type: string
              nullable: true
              example: Oliver Smith
            email:
              type: string
              nullable: true
              example: oliver@example.com
        group:
          type: object
          description: Group assigned to the conversation. All fields are `null` when no group is assigned.
          properties:
            id:
              type: string
              format: uuid
              nullable: true
              example: null
            name:
              type: string
              nullable: true
              example: null
        visitor:
          type: object
          description: Contact who started the conversation.
          properties:
            id:
              type: string
              format: uuid
              example: 2c79a334-0bc8-44e4-9504-331f59d400ab
            name:
              type: string
              nullable: true
              example: Sam Brown
            email:
              type: string
              nullable: true
              example: sam@example.com
            phone_number:
              type: string
              nullable: true
              example: null
            user_identifier:
              type: string
              nullable: true
              example: null
    pagination:
      type: object
      properties:
        current_page:
          type: integer
          description: Current page number.
          example: 1
        total_pages:
          type: integer
          description: Total number of pages available.
          example: 4
        total_count:
          type: integer
          description: Total number of records across all pages.
          example: 52
        per_page:
          type: integer
          description: Number of records per page.
          example: 15
    conversation_list_response:
      type: object
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/conversation'
        pagination:
          $ref: '#/components/schemas/pagination'
    error:
      type: object
      properties:
        error:
          type: string
          example: Conversation does not exist.
    conversation_response:
      type: object
      properties:
        conversation:
          $ref: '#/components/schemas/conversation'
    message:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 1bf689fc-9f92-4e39-9f71-4a97078d2b8f
        body:
          type: string
          description: Content of the message. It may contain HTML.
          example: <p>Thanks, we have processed your refund.</p>
        kind:
          type: string
          description: Type of the message. `user_message` is a chat message and `note` is an internal note that only team members can see. Other kinds, such as `system_message` and `activity_message`, are created by NeetoChat.
          example: user_message
        status:
          type: string
          example: read
        external_id:
          type: string
          nullable: true
          description: Your own id for the message, as sent when it was created.
          example: null
        created_at:
          type: string
          format: date-time
          example: '2026-10-05T16:26:57.912Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-10-05T16:26:57.912Z'
        sender:
          type: object
          properties:
            id:
              type: string
              format: uuid
              nullable: true
              example: 05665eee-4602-4317-8f7f-767b04274e5f
            name:
              type: string
              nullable: true
              example: Oliver Smith
            email:
              type: string
              nullable: true
              example: oliver@example.com
            type:
              type: string
              nullable: true
              description: '`User` for a team member and `Insights::Visitor` for a contact.'
              example: User
        attachments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              filename:
                type: string
                example: invoice.pdf
              content_type:
                type: string
                example: application/pdf
              url:
                type: string
                example: https://spinkart.neetochat.com/rails/active_storage/blobs/redirect/.../invoice.pdf
        message_gif:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            embed_url:
              type: string
            title:
              type: string
          example: null
    message_list_response:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/message'
        pagination:
          $ref: '#/components/schemas/pagination'
    message_response:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/message'
