openapi: 3.0.3
info:
  title: NeetoChat Contacts APIs
  version: 1.0.0

servers:
  $ref: "../schemas/common.yaml#/servers"

tags:
  - name: Contacts
    description: APIs to look up and create contacts in the workspace.

paths:
  /visitors:
    get:
      summary: List contacts
      tags:
        - Contacts
      description: |
        List contacts in the workspace, oldest first. Contacts created at the same time are ordered by `id`.

        Filter by `email` or `user_identifier` to find the contacts for a person. Neither value is unique in a workspace: the chat widget creates a separate contact for each browser a person chats from, so one person can have several contacts with the same email. These filters therefore return a list, which can contain more than one contact.
      parameters:
        - $ref: "../schemas/common.yaml#/api_key_header"
        - $ref: "../schemas/common.yaml#/accept_header"
        - in: query
          name: email
          description: Return only contacts with this email. The match ignores case.
          required: false
          schema:
            type: string
            format: email
            example: "sam@example.com"
        - in: query
          name: user_identifier
          description: Return only contacts with this `user_identifier`. When combined with `email`, a contact must match both.
          required: false
          schema:
            type: string
            example: "customer-1042"
        - $ref: "../schemas/conversation.yaml#/page_param"
        - $ref: "../schemas/conversation.yaml#/per_page_param"
      responses:
        "200":
          description: OK - Request succeeded. `contacts` is empty when no contact matches the filters.
          content:
            application/json:
              schema:
                $ref: "../schemas/contact.yaml#/components/schemas/contact_list_response"
        "422":
          description: Unprocessable Entity - A filter was passed as something other than a single string, such as an array
          content:
            application/json:
              schema:
                $ref: "../schemas/common.yaml#/components/schemas/error"
              example:
                error: "email and user_identifier must be strings."

    post:
      summary: Create contact
      tags:
        - Contacts
      description: Add a contact to the workspace.
      parameters:
        - $ref: "../schemas/common.yaml#/api_key_header"
        - $ref: "../schemas/common.yaml#/accept_header"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the contact. Defaults to `Visitor` when omitted or blank.
                  example: "Sam Brown"
                email:
                  type: string
                  format: email
                  description: Email of the contact. It is stored in lowercase, and an address that is not well-formed rejects the whole request.
                  example: "sam@example.com"
                phone_number:
                  type: string
                  example: "+14155550123"
                user_identifier:
                  type: string
                  description: Your own identifier for the contact, such as its id in your database or CRM. It is stored as sent and is not used to look up an existing contact.
                  example: "crm-user-123"
                traits:
                  type: object
                  description: Custom attributes to store on the contact, as free-form key-value pairs. The keys `name`, `email` and `user_identifier` are dropped here, since those are top-level fields.
                  additionalProperties: true
                  example:
                    plan: "Pro"
                    country: "US"
                field_values_attributes:
                  type: array
                  description: Values for the contact fields configured in your workspace, under **Settings > Contact fields**. Every `field_id` must be a contact field of your workspace, otherwise nothing is created.
                  items:
                    type: object
                    properties:
                      field_id:
                        type: string
                        format: uuid
                        description: Id of the contact field. It is the field's UUID, not the **Key** shown on the Contact fields page.
                        example: "7f1f1f36-1f0f-4a0e-9b1f-2b0f3c4d5e6f"
                      data:
                        type: object
                        description: |
                          The field's value, under a `value` key.

                          The accepted type follows the field's kind. A text field takes a string, a number field takes a number or a string that reads as one, and a date and time field takes an ISO 8601 string. A value the field's kind does not accept, or a number outside a range configured on the field, rejects the whole request.
                        properties:
                          value:
                            description: The field's value.
                            example: "Enterprise"
                        required:
                          - value
                        example:
                          value: "Enterprise"
                    required:
                      - field_id
                      - data
      responses:
        "201":
          description: Created - Contact created successfully
          content:
            application/json:
              schema:
                $ref: "../schemas/contact.yaml#/components/schemas/contact_response"
        "422":
          description: Unprocessable Entity - The request body is invalid, and no contact is created
          content:
            application/json:
              schema:
                $ref: "../schemas/common.yaml#/components/schemas/error"
              examples:
                invalid_email:
                  summary: Malformed email
                  value:
                    error: "Email is invalid"
                unknown_field:
                  summary: field_id is not a contact field of this workspace
                  value:
                    error: "Field values contain invalid field IDs."
                invalid_field_value:
                  summary: Field value the field's kind does not accept
                  value:
                    error: "Field values data has invalid number value"

  /visitors/{contact_id}:
    get:
      summary: Get contact details
      tags:
        - Contacts
      description: Retrieves a contact, including the values of its contact fields.
      parameters:
        - $ref: "../schemas/common.yaml#/api_key_header"
        - $ref: "../schemas/common.yaml#/accept_header"
        - $ref: "../schemas/contact.yaml#/contact_id_param"
      responses:
        "200":
          description: OK - Request succeeded
          content:
            application/json:
              schema:
                $ref: "../schemas/contact.yaml#/components/schemas/contact_response"
        "404":
          description: Not Found - No contact with this id exists in the workspace
          content:
            application/json:
              schema:
                $ref: "../schemas/common.yaml#/components/schemas/error"
              example:
                error: "Insights::Visitor does not exist."
